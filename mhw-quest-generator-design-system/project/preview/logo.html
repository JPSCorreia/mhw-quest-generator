<!doctype html>
<html><head><meta charset="utf-8"><title>Logo / Crest</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:center;font-family:var(--font-sans)}
  .card{background:#08050f;border:1px solid var(--border);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:180px;justify-content:center}
  .card img{display:block}
  @keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(91,255,125,.6))}50%{filter:drop-shadow(0 0 14px rgba(91,255,125,.9))}}
  .pulse img{animation:pulse 3s ease-in-out infinite}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);letter-spacing:.08em}
  .wordmark{display:flex;align-items:center;gap:10px}
  .wordmark span{font-family:var(--font-display);font-weight:900;letter-spacing:.18em;color:var(--gold-100);font-size:14px;text-transform:uppercase;line-height:1}
  .wordmark small{display:block;color:var(--emerald-400);letter-spacing:.3em;font-size:9px;font-weight:600;margin-top:3px}
</style></head><body>
  <div class="card"><img src="../assets/mhw-logo.svg" width="100" height="100"><div class="lbl">crest · 100px</div></div>
  <div class="card pulse"><img src="../assets/mhw-logo.svg" width="100" height="100"><div class="lbl">crest · live pulse</div></div>
  <div class="card"><div class="wordmark"><img src="../assets/mhw-logo.svg" width="48" height="48"><div><span>Quest<br>Generator</span><small>RESEARCH COMMISSION</small></div></div><div class="lbl">lockup</div></div>
</body></html>
