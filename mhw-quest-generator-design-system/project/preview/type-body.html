<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Body</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800)}
  .row{display:flex;flex-direction:column;gap:14px}
  .spec{display:flex;gap:24px;border-bottom:1px solid var(--divider);padding-bottom:10px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle);min-width:120px;white-space:nowrap;flex-shrink:0}
  .paper{background:var(--parch-200);color:var(--fg-ink);padding:10px 14px;font-family:var(--font-serif);font-size:18px}
</style></head><body>
<div class="row">
  <div class="spec"><div class="meta">marcellus / 20</div><div class="paper">The Rathalos has reclaimed its roost above the Ancient Forest.</div></div>
  <div class="spec"><div class="meta">marcellus / 15</div><p style="margin:0">Armory recommends piercing damage. Return with its ruby, or do not return.</p></div>
  <div class="spec"><div class="meta">inter 500 / 13</div><div class="ui-label">Prevent Weapon Repeat</div></div>
  <div class="spec"><div class="meta">jetbrains / 13</div><div class="stat">HR 999 · 00:42:17 · 87.3%</div></div>
  <div class="spec"><div class="meta">inter / 11</div><div class="caption">Last updated 2 minutes ago by Commander</div></div>
</div>
</body></html>
