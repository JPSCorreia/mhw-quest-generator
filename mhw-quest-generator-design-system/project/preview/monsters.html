<!doctype html>
<html><head><meta charset="utf-8"><title>Monster Portraits</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .cell{aspect-ratio:1;background:linear-gradient(180deg,rgba(59,45,87,.5),rgba(20,13,31,.9));border:1px solid var(--gold-500);position:relative;overflow:hidden;clip-path:polygon(0 6px,6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px))}
  .cell img{width:100%;height:100%;object-fit:contain;padding:6px;box-sizing:border-box}
  .cell.active{border-color:var(--emerald-400);box-shadow:0 0 14px rgba(91,255,125,.5) inset,0 0 10px rgba(91,255,125,.3)}
  .name{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));color:var(--parch-100);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:12px 4px 3px;text-align:center;font-family:var(--font-display);font-weight:600}
</style></head><body>
<div class="grid">
  <div class="cell active"><img src="../assets/monsters/Rathalos.webp"><div class="name">Rathalos</div></div>
  <div class="cell"><img src="../assets/monsters/Nergigante.webp"><div class="name">Nergigante</div></div>
  <div class="cell"><img src="../assets/monsters/Diablos.webp"><div class="name">Diablos</div></div>
  <div class="cell"><img src="../assets/monsters/Anjanath.webp"><div class="name">Anjanath</div></div>
  <div class="cell"><img src="../assets/monsters/Teostra.webp"><div class="name">Teostra</div></div>
  <div class="cell"><img src="../assets/monsters/Velkhana.webp"><div class="name">Velkhana</div></div>
  <div class="cell"><img src="../assets/monsters/Fatalis.webp"><div class="name">Fatalis</div></div>
</div>
</body></html>
