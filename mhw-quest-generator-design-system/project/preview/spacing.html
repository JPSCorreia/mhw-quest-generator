<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);display:grid;grid-template-columns:1fr 1fr;gap:20px;font-family:var(--font-sans)}
  h4{font-family:var(--font-display);font-size:10px;letter-spacing:.24em;color:var(--gold-300);margin:0 0 10px;text-transform:uppercase}
  .bar{background:var(--emerald-500);height:10px;border-radius:2px;margin-bottom:4px;box-shadow:0 0 8px rgba(91,255,125,.4)}
  .tok{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);margin-bottom:6px}
  .tok span:last-child{color:var(--fg-subtle);margin-left:auto}
  .shape{display:inline-block;width:48px;height:48px;background:var(--ink-600);border:1px solid var(--gold-500);margin-right:8px;vertical-align:middle}
  .shapes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .shape-lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
  .chamfer{clip-path:polygon(0 10px,10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px));border:none;background:linear-gradient(135deg,var(--gold-500),var(--gold-300))}
</style></head><body>
<div>
  <h4>Spacing scale · 4px base</h4>
  <div class="tok"><div class="bar" style="width:4px"></div><span>--space-1</span><span>4</span></div>
  <div class="tok"><div class="bar" style="width:8px"></div><span>--space-2</span><span>8</span></div>
  <div class="tok"><div class="bar" style="width:12px"></div><span>--space-3</span><span>12</span></div>
  <div class="tok"><div class="bar" style="width:16px"></div><span>--space-4</span><span>16</span></div>
  <div class="tok"><div class="bar" style="width:24px"></div><span>--space-5</span><span>24</span></div>
  <div class="tok"><div class="bar" style="width:32px"></div><span>--space-6</span><span>32</span></div>
  <div class="tok"><div class="bar" style="width:48px"></div><span>--space-7</span><span>48</span></div>
  <div class="tok"><div class="bar" style="width:64px"></div><span>--space-8</span><span>64</span></div>
</div>
<div>
  <h4>Radii & chamfer · sharp by default</h4>
  <div class="shapes">
    <div><div class="shape" style="border-radius:2px"></div><div class="shape-lbl">xs·2</div></div>
    <div><div class="shape" style="border-radius:4px"></div><div class="shape-lbl">sm·4</div></div>
    <div><div class="shape" style="border-radius:6px"></div><div class="shape-lbl">md·6</div></div>
    <div><div class="shape" style="border-radius:10px"></div><div class="shape-lbl">lg·10</div></div>
    <div><div class="shape chamfer"></div><div class="shape-lbl">chamfer ★</div></div>
  </div>
  <p style="font-family:var(--font-sans);font-size:11px;color:var(--fg-subtle);margin-top:14px;line-height:1.5">Ceremonial surfaces use a 14px diagonal <code style="color:var(--emerald-300);font-size:11px">clip-path</code> chamfer instead of rounded corners.</p>
</div>
</body></html>
