<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Tier</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);font-family:var(--font-sans);color:var(--fg)}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .card{padding:16px;background:var(--ink-700);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;gap:8px}
  .dot{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(255,255,255,.15)}
  .name{font-family:var(--font-display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--parch-100)}
  .desc{font-size:11px;color:var(--fg-subtle);letter-spacing:.04em}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
</style></head><body>
<div class="row">
  <div class="card"><div class="dot" style="background:var(--tier-low);box-shadow:0 0 10px var(--tier-low)"></div><div class="name">Low Rank</div><div class="desc">★ 1–3 quarries</div><div class="hex">#6fae55</div></div>
  <div class="card"><div class="dot" style="background:var(--tier-mid);box-shadow:0 0 10px var(--tier-mid)"></div><div class="name">High Rank</div><div class="desc">★ 4–6 quarries</div><div class="hex">#d6a03b</div></div>
  <div class="card"><div class="dot" style="background:var(--tier-high);box-shadow:0 0 10px var(--tier-high)"></div><div class="name">Master Rank</div><div class="desc">★ 7–9 quarries</div><div class="hex">#c95230</div></div>
  <div class="card"><div class="dot" style="background:var(--tier-super);box-shadow:0 0 14px var(--tier-super)"></div><div class="name">Arch-Tempered</div><div class="desc">Elder dragon / event</div><div class="hex">#7e5bff</div></div>
</div>
</body></html>
