<!doctype html>
<html><head><meta charset="utf-8"><title>Quest Card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);font-family:var(--font-sans)}
  .card{position:relative;background:linear-gradient(180deg,#eedcb4,#d5bf86);color:var(--fg-ink);padding:18px 22px;border:2px solid var(--parch-500);box-shadow:var(--shadow-lg);clip-path:var(--cut-corner);max-width:640px;margin:0 auto;display:flex;gap:16px;align-items:center}
  .card::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/></svg>");mix-blend-mode:multiply;pointer-events:none}
  .eyebrow{color:var(--parch-500);font-family:var(--font-sans);font-weight:700;font-size:10px;letter-spacing:.28em;text-transform:uppercase}
  .title{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:.14em;text-transform:uppercase;margin:2px 0 2px;color:#2a1e0a}
  .desc{font-family:var(--font-serif);font-size:13px;margin:0;color:#4b3a1a}
  .stars{color:#c95230;letter-spacing:2px;font-size:14px}
  .portrait{width:90px;height:90px;background:var(--ink-700);border:2px solid var(--gold-500);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px));flex-shrink:0}
  .portrait img{width:80%;height:80%;object-fit:contain}
</style></head><body>
  <div class="card">
    <div class="portrait"><img src="../assets/monsters/Rathalos.webp" alt=""></div>
    <div style="position:relative">
      <div class="eyebrow">COMMISSION № 047 · <span class="stars">★★★★★</span></div>
      <h3 class="title">A Skyward Calamity</h3>
      <p class="desc">The Rathalos has reclaimed its roost above the Ancient Forest. Armory recommends piercing damage.</p>
    </div>
  </div>
</body></html>
