<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Core</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--ink-800);font-family:var(--font-sans);color:var(--fg)}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .sw{display:flex;flex-direction:column;gap:4px}
  .chip{height:64px;border-radius:4px;border:1px solid var(--border);position:relative;overflow:hidden}
  .chip::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 40%)}
  .name{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--fg-subtle)}
  .group{margin-bottom:16px}
  .label{font-family:var(--font-display);font-size:10px;letter-spacing:.24em;color:var(--gold-300);text-transform:uppercase;margin-bottom:6px}
</style></head><body>
<div class="group"><div class="label">Ink — night violet</div><div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">ink-900</div><div class="hex">#0b0712</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><div class="name">ink-800</div><div class="hex">#140d1f</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">ink-700</div><div class="hex">#1e1430</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><div class="name">ink-600</div><div class="hex">#2a1f42</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">ink-500</div><div class="hex">#3b2d57</div></div>
</div></div>
<div class="group"><div class="label">Parchment — quest scroll</div><div class="row">
  <div class="sw"><div class="chip" style="background:var(--parch-100)"></div><div class="name">parch-100</div><div class="hex">#f4e8cf</div></div>
  <div class="sw"><div class="chip" style="background:var(--parch-200)"></div><div class="name">parch-200</div><div class="hex">#e8d7ad</div></div>
  <div class="sw"><div class="chip" style="background:var(--parch-300)"></div><div class="name">parch-300</div><div class="hex">#d5bf86</div></div>
  <div class="sw"><div class="chip" style="background:var(--parch-400)"></div><div class="name">parch-400</div><div class="hex">#a78b54</div></div>
  <div class="sw"><div class="chip" style="background:var(--parch-500)"></div><div class="name">parch-500</div><div class="hex">#6b5432</div></div>
</div></div>
</body></html>
